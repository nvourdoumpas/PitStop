<!DOCTYPE html>
<html>
<head>
    <title>PitStop API - Documentation</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/redoc-ui/custom.css" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700" rel="stylesheet">
</head>
<body>
    <redoc spec-url="/swagger/v1/swagger.json" expand-responses="200,201">
    </redoc>

    <script src="https://cdn.jsdelivr.net/npm/redoc@next/bundles/redoc.standalone.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            const interval = setInterval(() => {
                const sidebar = document.querySelector('.menu-content');
                if (sidebar) {
                    const logo = document.createElement('img');
                    logo.src = '/logo.png';
                    logo.alt = 'PitStop Logo';
                    logo.style.width = '180px';
                    logo.style.margin = '20px auto';
                    sidebar.insertBefore(logo, sidebar.firstChild);
                    clearInterval(interval);
                }
            }, 300);
        });
    </script>
</body>
</html>
